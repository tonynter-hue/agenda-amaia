<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agenda de Amaia</title>

  <!-- === TEMA HTML 1: METADATOS Y PWA === -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#7c5dfa">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- === TEMA HTML 2: CABECERA CON IMAGEN Y MENÚ 3 PUNTOS === -->
  <header class="hero-header" id="hero-header">
    <div class="hero-overlay"></div>
    
    <div class="menu-container">
      <button class="btn-menu-dots" id="menu-dots-btn" aria-label="Opciones">⋮</button>
      <div class="menu-dropdown" id="menu-dropdown">
        <label class="menu-item" for="cover-input">
          📷 Cambiar fondo
        </label>
      </div>
    </div>
    <input type="file" id="cover-input" accept="image/*" style="display: none;">

    <div class="hero-info">
      <h1 class="hero-title">Espacio de Amaia ✨</h1>
      <p class="hero-date" id="current-date">Cargando fecha...</p>
    </div>
  </header>

  <!-- === TEMA HTML 3: NAVEGACIÓN SUPERIOR (PÍLDORAS) === -->
  <nav class="nav-pills-bar">
    <button class="pill-btn active" data-target="view-agenda">AGENDA</button>
    <button class="pill-btn" data-target="view-asignaturas">ASIGNATURAS</button>
    <button class="pill-btn" data-target="view-youtube">YOUTUBE</button>
    <button class="pill-btn" data-target="view-calendario">CALENDARIO</button>
  </nav>

  <!-- === TEMA HTML 4: CONTENEDOR Y VISTAS === -->
  <main class="main-card">

    <!-- Subtema 4.1: Vista Agenda -->
    <section id="view-agenda" class="view-panel active">
      <h2 class="section-title">AGENDA</h2>

      <button class="btn-add" id="open-form-btn">
        <span>＋</span> Añadir tarea o examen
      </button>

      <div class="form-card" id="task-form-card">
        <form id="task-form">
          <div class="form-group">
            <label for="task-subject">Asignatura</label>
            <select id="task-subject" required>
              <option value="Matemáticas">Matemáticas</option>
              <option value="Lengua">Lengua</option>
              <option value="Francés">Francés</option>
              <option value="ATT">ATT</option>
              <option value="Valores">Valores</option>
              <option value="Plástica">Plástica</option>
              <option value="Ciencias">Ciencias</option>
              <option value="Inglés">Inglés</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-title">Descripción</label>
            <input type="text" id="task-title" placeholder="Ej: Ejercicios pág 42 o Examen tema 3" required>
          </div>

          <div class="form-group">
            <label for="task-due">Fecha de entrega / Examen</label>
            <input type="date" id="task-due" required>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" id="close-form-btn">Cancelar</button>
            <button type="submit" class="btn-save">Guardar</button>
          </div>
        </form>
      </div>

      <div class="task-list" id="task-list"></div>
    </section>

    <!-- Subtema 4.2: Vista Asignaturas -->
    <section id="view-asignaturas" class="view-panel">
      <!-- 1. Pantalla de listado -->
      <div id="subjects-list-screen">
        <h2 class="section-title">MIS ASIGNATURAS</h2>
        <div class="classroom-grid" id="classroom-grid"></div>
      </div>

      <!-- 2. Pantalla detalle de la materia -->
      <div id="subject-detail-screen" class="subject-detail" style="display: none;">
        <button class="btn-back-subjects" id="btn-back-subjects">← Volver a asignaturas</button>
        
        <div class="subject-header-banner" id="detail-banner">
          <h2 id="detail-title">Nombre Asignatura</h2>
          <p id="detail-course-prof">Curso • Profesor</p>
        </div>

        <div class="note-input-card">
          <textarea id="note-text" placeholder="Escribe un apunte, resumen o deberes..." rows="3"></textarea>
          
          <div class="note-attach-bar">
            <label class="btn-photo-attach" for="note-photo-input">
              📷 <span>Añadir foto de pizarra o cuaderno</span>
            </label>
            <input type="file" id="note-photo-input" accept="image/*" capture="environment" style="display:none;">
            <span id="photo-preview-name" class="photo-badge" style="display: none;">Foto lista ✓</span>
          </div>

          <button class="btn-save-note" id="btn-save-note">Publicar en la asignatura</button>
        </div>

        <div class="subject-notes-list" id="subject-notes-list"></div>
      </div>

      <!-- 3. Modal de personalización y orden -->
      <div id="modal-edit-subject" class="modal-overlay" style="display: none;">
        <div class="modal-card">
          <h3 class="modal-title">Personalizar Asignatura</h3>
          <form id="form-edit-subject">
            <div class="form-group">
              <label for="edit-sub-name">Nombre de la asignatura</label>
              <input type="text" id="edit-sub-name" required>
            </div>
            <div class="form-group">
              <label for="edit-sub-course">Curso / Año</label>
              <input type="text" id="edit-sub-course" required>
            </div>
            <div class="form-group">
              <label for="edit-sub-prof">Nombre del Profesor/a</label>
              <input type="text" id="edit-sub-prof" required>
            </div>

            <div class="form-group">
              <label>Color de fondo</label>
              <div class="color-options-row" id="color-palette"></div>
              <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
                <input type="color" id="edit-sub-color-picker" value="#1e3c72" style="width: 44px; height: 36px; padding: 2px; cursor: pointer;">
                <span style="font-size: 0.8rem; color: var(--text-muted);">O elige un color libre</span>
