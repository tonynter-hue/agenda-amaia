<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agenda de Amaia</title>

  <!-- === TEMA HTML 1: METADATOS Y PWA === -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#7c5dfa">
  <link rel="stylesheet" href="estilos.css?v=2">
</head>
<body>

  <!-- === TEMA HTML 2: CABECERA Y MENÚ === -->
  <header class="hero-header" id="hero-header">
    <div class="hero-overlay"></div>
    <div class="menu-container">
      <button class="btn-menu-dots" id="menu-dots-btn" aria-label="Opciones">⋮</button>
      <div class="menu-dropdown" id="menu-dropdown">
        <label class="menu-item" for="cover-input">📷 Cambiar fondo</label>
      </div>
    </div>
    <input type="file" id="cover-input" accept="image/*" style="display: none;">

    <div class="hero-info">
      <h1 class="hero-title">Espacio de Amaia ✨</h1>
      <p class="hero-date" id="current-date">Cargando fecha...</p>
    </div>
  </header>

  <!-- === TEMA HTML 3: BARRA DE PESTAÑAS (NAVEGACIÓN DIRECTA) === -->
  <nav class="nav-pills-bar">
    <button class="pill-btn active" data-target="view-agenda" onclick="switchTab('view-agenda', this)">AGENDA</button>
    <button class="pill-btn" data-target="view-asignaturas" onclick="switchTab('view-asignaturas', this)">ASIGNATURAS</button>
    <button class="pill-btn" data-target="view-youtube" onclick="switchTab('view-youtube', this)">YOUTUBE</button>
    <button class="pill-btn" data-target="view-calendario" onclick="switchTab('view-calendario', this)">CALENDARIO</button>
  </nav>

  <!-- === TEMA HTML 4: CONTENEDOR PRINCIPAL === -->
  <main class="main-card">

    <!-- 4.1 Vista Agenda -->
    <section id="view-agenda" class="view-panel active">
      <h2 class="section-title">AGENDA</h2>
      <button class="btn-add" id="open-form-btn"><span>＋</span> Añadir tarea o examen</button>

      <div class="form-card" id="task-form-card">
        <form id="task-form">
          <div class="form-group">
            <label for="task-subject">Asignatura</label>
            <select id="task-subject" required>
              <option value="Matemáticas">Matemáticas</option>
              <option value="Lengua">Lengua</option>
              <option value="Francés">Francés</option>
              <option value="ATT">ATT</option>
              <option value="Valores">Valores</option>
              <option value="Plástica">Plástica</option>
              <option value="Ciencias">Ciencias</option>
              <option value="Inglés">Inglés</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-title">Descripción</label>
            <input type="text" id="task-title" placeholder="Ej: Ejercicios tema 3" required>
          </div>
          <div class="form-group">
            <label for="task-due">Fecha de entrega</label>
            <input type="date" id="task-due" required>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-cancel" id="close-form-btn">Cancelar</button>
            <button type="submit" class="btn-save">Guardar</button>
          </div>
        </form>
      </div>
      <div class="task-list" id="task-list"></div>
    </section>

    <!-- 4.2 Vista Asignaturas -->
    <section id="view-asignaturas" class="view-panel">
      <div id="subjects-list-screen">
        <h2 class="section-title">MIS ASIGNATURAS</h2>
        <div class="classroom-grid" id="classroom-grid"></div>
      </div>

      <div id="subject-detail-screen" style="display: none;">
        <button class="btn-back-subjects" id="btn-back-subjects">← Volver a asignaturas</button>
        <div class="subject-header-banner" id="detail-banner">
          <h2 id="detail-title">Asignatura</h2>
          <p id="detail-course-prof">Curso • Profesor</p>
        </div>

        <div class="note-input-card">
          <textarea id="note-text" placeholder="Escribe un apunte o deberes..." rows="3"></textarea>
          <div class="note-attach-bar">
            <label class="btn-photo-attach" for="note-photo-input">
              📷 <span>Foto pizarra / cuaderno</span>
            </label>
            <input type="file" id="note-photo-input" accept="image/*" capture="environment" style="display:none;">
            <span id="photo-preview-name" class="photo-badge" style="display: none;">Foto lista ✓</span>
          </div>
          <button class="btn-save-note" id="btn-save-note">Publicar en la asignatura</button>
        </div>
        <div class="subject-notes-list" id="subject-notes-list"></div>
      </div>

      <!-- Modal editar materia -->
      <div id="modal-edit-subject" class="modal-overlay" style="display: none;">
        <div class="modal-card">
          <h3 class="modal-title">Personalizar Asignatura</h3>
          <form id="form-edit-subject">
            <div class="form-group">
              <label for="edit-sub-name">Nombre</label>
              <input type="text" id="edit-sub-name" required>
            </div>
            <div class="form-group">
              <label for="edit-sub-course">Curso</label>
              <input type="text" id="edit-sub-course" required>
            </div>
            <div class="form-group">
              <label for="edit-sub-prof">Profesor/a</label>
              <input type="text" id="edit-sub-prof" required>
            </div>
            <div class="form-group">
              <label>Color de tarjeta</label>
              <div class="color-options-row" id="color-palette"></div>
              <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
                <input type="color" id="edit-sub-color-picker" value="#1e3c72" style="width: 44px; height: 34px; padding: 2px; cursor: pointer;">
                <span style="font-size: 0.8rem; color: var(--text-muted);">Color libre</span>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn-cancel" id="btn-cancel-edit-sub">Cancelar</button>
              <button type="submit" class="btn-save">Guardar</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Visor de foto ampliada -->
      <div id="modal-photo-viewer" class="photo-modal-overlay" style="display: none;">
        <button class="btn-close-photo" id="btn-close-photo">✕</button>
        <img id="modal-expanded-img" src="" alt="Foto">
      </div>
    </section>

    <!-- 4.3 Vista YouTube -->
    <section id="view-youtube" class="view-panel">
      <!-- Pantalla de asignaturas para YouTube -->
      <div id="yt-subjects-screen">
        <h2 class="section-title">VÍDEOS POR ASIGNATURA</h2>
        <div class="classroom-grid" id="yt-classroom-grid"></div>
      </div>

      <!-- Pantalla de vídeos de la asignatura seleccionada -->
      <div id="yt-videos-screen" style="display: none;">
        <button class="btn-back-subjects" id="btn-back-yt-subjects">← Volver a asignaturas</button>
        
        <div class="subject-header-banner" id="yt-detail-banner">
          <h2 id="yt-detail-title">Asignatura</h2>
          <p id="yt-detail-subtitle">Vídeos y enlaces de estudio</p>
        </div>

        <div class="note-input-card">
          <div class="form-group">
            <label for="yt-video-url">Enlace del vídeo de YouTube</label>
            <input type="url" id="yt-video-url" placeholder="Ej: https://youtu.be/... o https://youtube.com/watch?v=..." required>
          </div>
          <div class="form-group">
            <label for="yt-video-title">Título o tema del vídeo (opcional)</label>
            <input type="text" id="yt-video-title" placeholder="Ej: Explicación de las fracciones">
          </div>
          <button class="btn-save-note" id="btn-save-yt-video">＋ Guardar vídeo en la materia</button>
        </div>

        <div class="yt-video-grid" id="yt-videos-container"></div>
      </div>

      <!-- Reproductor integrado -->
      <div id="modal-yt-player" class="photo-modal-overlay" style="display: none;">
        <button class="btn-close-photo" id="btn-close-yt-player">✕</button>
        <div class="yt-player-box">
          <iframe id="yt-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- 4.4 Vista Calendario -->
    <section id="view-calendario" class="view-panel">
      <h2 class="section-title">CALENDARIO</h2>
      <div class="placeholder-box">
        <p>🗓️ <b>Calendario Escolar</b></p>
        <p>Próximo módulo a programar.</p>
      </div>
    </section>

  </main>

  <!-- === TEMA HTML 5: SCRIPTS Y LIBRERÍAS === -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
